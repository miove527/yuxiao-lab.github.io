<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Xiao Lab</title>
  <meta name="description" content="Gallery from Xiao Lab at Fudan University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>document.documentElement.classList.remove('no-js');</script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Xiao Lab home">
      <span>
        <strong>Xiao Lab</strong>
        <small>Department of Chemistry, Fudan University</small>
      </span>
    </a>
    <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="publications.html">Publications</a>
      <a href="software.html">Software</a>
      <a href="people.html">People</a>
      <a href="teaching.html">Teaching</a>
      <a class="active" aria-current="page" href="gallery.html">Gallery</a>
    </nav>
  </header>

  <main>
    <section class="page-hero gallery-intro">
      <p class="eyebrow">Gallery</p>
      <h1>Moments from the lab and beyond</h1>
    </section>

    <div class="section gallery-filter" hidden>
      <label for="gallery-category">Category</label>
      <select id="gallery-category"><option value="all">All activities</option><option value="gathering">Gathering</option><option value="outing">Outing</option></select>
    </div>
    <section class="section gallery-grid">
      <figure data-category="gathering"><img src="assets/gallery/2026-09-09/gallery-20260909-1.jpg" alt="Lab gathering in September 2026, photo 1" loading="lazy" decoding="async"><figcaption><button class="gallery-open" type="button">Lab gathering, September 2026.</button></figcaption><div class="gallery-photos" hidden><a href="assets/gallery/2026-09-09/gallery-20260909-1.jpg" data-alt="Lab gathering in September 2026, photo 1">Photo</a><a href="assets/gallery/2026-09-09/gallery-20260909-2.jpg" data-alt="Lab gathering in September 2026, photo 2">Photo</a></div></figure>
<figure data-category="outing"><img src="assets/gallery/2026-04-11-sheshan/gallery-sheshan-20260411-1.jpg" alt="Group visit to Sheshan" loading="lazy" decoding="async"><figcaption><button class="gallery-open" type="button">Sheshan outing, April 2026.</button></figcaption><div class="gallery-photos" hidden><a href="assets/gallery/2026-04-11-sheshan/gallery-sheshan-20260411-1.jpg" data-alt="Group visit to Sheshan">Photo</a></div></figure>
<figure data-category="gathering"><img src="assets/gallery/2025-09-10/gallery-20250910-1.jpg" alt="Lab members together" loading="lazy" decoding="async"><figcaption><button class="gallery-open" type="button">Lab gathering, September 2025.</button></figcaption><div class="gallery-photos" hidden><a href="assets/gallery/2025-09-10/gallery-20250910-1.jpg" data-alt="Lab members together">Photo</a><a href="assets/gallery/2025-09-10/gallery-20250910-2.jpg" data-alt="Lab group photo">Photo</a></div></figure>
    </section>
    <dialog class="gallery-dialog" aria-label="Activity photos">
      <button type="button" class="gallery-close" aria-label="Close photo viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <img alt="">
      <div class="gallery-controls"><button type="button" class="gallery-previous" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><span aria-live="polite"></span><button type="button" class="gallery-next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div>
    </dialog>
  </main>

  <footer class="site-footer">
    <p>Xiao Lab, Department of Chemistry, Fudan University</p>
    <p>2005 Songhu Road, Yangpu District, Shanghai 200438, China</p>
  </footer>
  <script src="assets/site.js" defer></script>
</body>
</html>
